# Café la Escuelita — página estática (en proceso)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cafelaescuelita.site www.cafelaescuelita.site;

    root /var/www/projects/invoiceplane/cafelaescuelita.site;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/cafelaescuelita.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cafelaescuelita.site/privkey.pem;

    # Seguridad. Ojo: cualquier add_header dentro de un location anula estos,
    # por eso la caché se maneja con "expires" (que no los pisa).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compresión: el HTML (≈120 KB por los dibujos SVG) baja a ≈20 KB
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain;

    # La página: el navegador siempre pregunta si hay versión nueva (respuesta 304 si no cambió)
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # Archivos ocultos (.git, .env...): nunca. Va antes que el bloque de estáticos.
    location ~ /\. {
        deny all;
    }

    # Archivos estáticos: caché de 1 año. Es seguro porque construir.py les agrega ?v=<huella>
    # y la huella cambia cada vez que el archivo cambia.
    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|webp|avif|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    access_log /var/log/nginx/cafelaescuelita_access.log;
    error_log  /var/log/nginx/cafelaescuelita_error.log;
}
